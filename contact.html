<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DUGEN - Healthcare & Community Services</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">DUGEN <span>Healthcare</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li><li><a href="about.html">About DUGEN</a></li><li><a href="home-care.html">Home Care</a></li><li><a href="recruitment.html">Healthcare Recruitment</a></li><li><a href="community.html">Community Support</a></li><li><a href="careers.html">Careers</a></li><li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <div class="container">
      <h1>Contact Us</h1>
      <p style="margin-bottom: 2rem;">Get in touch with our team for inquiries, support requests, or career opportunities.</p>
      
      <div style="max-width: 600px; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent.');">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="John Doe">
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="john@example.com">
          </div>
          <div class="form-group">
            <label for="subject">Subject / Service</label>
            <select id="subject" name="subject">
              <option>General Inquiry</option>
              <option>Home Care Services</option>
              <option>Healthcare Recruitment</option>
              <option>Community Support</option>
              <option>Careers</option>
            </select>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required placeholder="How can we help you?"></textarea>
          </div>
          <button type="submit" class="btn">Send Message</button>
        </form>
      </div>
    </div>
  </main>
  <footer>
    <div class="container" style="padding: 1rem;">
      <p>&copy; 2026 DUGEN Healthcare Services. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
